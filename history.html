<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ticker Detail</title>
    <meta name="description" content="30-day watchlist behavior history by ticker.">
    <meta name="theme-color" content="#070a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Trade Copilot">
    <link rel="icon" href="./assets/brand/concept-c-app-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./assets/brand/apple-touch-icon.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./assets/styles.css?v=geist-sans-20260602">
    <script defer src="./assets/app.js?v=geist-sans-20260602"></script>
  </head>
  <body data-page="history">
    <main class="shell">
      <section class="hero">
        <div>
          <a class="brand" href="./" aria-label="Daily Trade Copilot home">
            <span class="brand-mark" aria-hidden="true">
              <img src="./assets/brand/concept-c-app-icon.svg" alt="">
            </span>
            <span class="brand-copy">
              <span class="brand-name">Daily Trade Copilot</span>
              <span class="brand-subtitle">Detail</span>
            </span>
          </a>
          <h1 id="history-title">Oracle</h1>
          <p id="ticker-name" class="subtle ticker-name"></p>
          <p id="status" class="subtle meta">Loading ticker history...</p>
          <div id="run-status" class="status bad">No history loaded</div>
        </div>
      </section>

      <section class="history-grid">
        <aside id="snapshot" class="panel">
          <form id="ticker-form">
            <label class="subtle" for="ticker">Ticker</label>
            <input id="ticker" class="ticker-input" autocomplete="off">
            <button class="button primary" type="submit">Show History</button>
          </form>
          <div id="latest-panel" class="timeline"></div>
        </aside>

        <section id="behavior" class="panel">
          <h2>Behavior Journey</h2>
          <div id="history-visual" class="history-visual">
            <div class="empty">Loading visual history...</div>
          </div>
          <div id="timeline" class="timeline">
            <div class="empty">Loading history...</div>
          </div>
        </section>
      </section>
    </main>
    <nav class="app-tabbar" aria-label="App navigation">
      <a href="./"><span>Home</span></a>
      <a href="#snapshot" class="active"><span>Signal</span></a>
      <a href="#behavior"><span>Journey</span></a>
      <a href="#timeline"><span>Lookback</span></a>
    </nav>
  </body>
</html>
