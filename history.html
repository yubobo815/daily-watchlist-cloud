<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ticker History</title>
    <meta name="description" content="30-day watchlist behavior history by ticker.">
    <link rel="stylesheet" href="./assets/styles.css">
    <script defer src="./assets/app.js"></script>
  </head>
  <body data-page="history">
    <main class="shell">
      <section class="hero">
        <div>
          <a class="brand" href="./" aria-label="Daily Trade Copilot home">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 64 64" role="img">
                <defs>
                  <linearGradient id="mark-bg-history" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
                    <stop offset="0" stop-color="#1d271f"></stop>
                    <stop offset="1" stop-color="#080b09"></stop>
                  </linearGradient>
                </defs>
                <rect class="mark-bg" x="3" y="3" width="58" height="58" rx="18" fill="url(#mark-bg-history)"></rect>
                <path class="mark-grid" d="M17 18h30M17 32h30M17 46h30M18 17v30M32 17v30M46 17v30"></path>
                <path class="mark-monogram" d="M17 45V19h9c8 0 13 5 13 13s-5 13-13 13h-9M28 19h20M38 19v26"></path>
                <path class="mark-signal" d="M14 42l9-11 8 6 10-17 9 4"></path>
                <circle class="mark-dot" cx="50" cy="24" r="4"></circle>
              </svg>
            </span>
            <span class="brand-copy">
              <span class="brand-name">Daily Trade Copilot</span>
              <span class="brand-subtitle">Behavior rewind</span>
            </span>
          </a>
          <h1 id="history-title">ORCL 30-Day History</h1>
          <p id="status" class="subtle meta">Loading ticker history...</p>
          <div id="run-status" class="status bad">No history loaded</div>
        </div>
        <div class="actions">
          <a class="button" href="./">Back to Watchlist</a>
        </div>
      </section>

      <section class="history-grid">
        <aside class="panel">
          <form id="ticker-form">
            <label class="subtle" for="ticker">Ticker</label>
            <input id="ticker" class="ticker-input" autocomplete="off">
            <button class="button primary" type="submit">Show History</button>
          </form>
          <div id="latest-panel" class="timeline"></div>
        </aside>

        <section class="panel">
          <h2>Behavior Journey</h2>
          <div id="history-visual" class="history-visual">
            <div class="empty">Loading visual history...</div>
          </div>
          <div id="timeline" class="timeline">
            <div class="empty">Loading history...</div>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
