<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ticker Detail</title>
    <meta name="description" content="Current execution plan and 30-day watchlist behavior by ticker.">
    <meta name="theme-color" content="#070a0f">
    <link rel="icon" href="./assets/brand/concept-c-app-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./assets/brand/apple-touch-icon.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./assets/styles.css?v=editorial-workspace-20260716">
    <script defer src="./assets/app.js?v=editorial-workspace-20260716"></script>
  </head>
  <body data-page="history">
    <main class="shell">
      <section class="hero"><div>
        <a class="brand" href="./" aria-label="Daily Trade Copilot home"><span class="brand-mark" aria-hidden="true"><img src="./assets/brand/concept-c-app-icon.svg" alt=""></span><span class="brand-copy"><span class="brand-name">Daily Trade Copilot</span><span class="brand-subtitle">Detail</span></span></a>
        <h1 id="history-title">Oracle</h1><div id="ticker-name" class="subtle ticker-name"></div><p id="status" class="subtle meta">Loading ticker history...</p><div id="run-status" class="status bad">No history loaded</div><p id="app-disclaimer" class="app-disclaimer"></p>
      </div></section>
      <section class="history-grid">
        <aside id="snapshot" class="panel block-current-read"><h2>Current Read</h2><form id="ticker-form"><label class="subtle" for="ticker">Ticker</label><input id="ticker" class="ticker-input" autocomplete="off"><button class="button primary" type="submit">Show History</button></form><div id="latest-panel" class="timeline"></div></aside>
        <section id="behavior" class="panel block-behavior-journey"><h2>Behavior Journey</h2><div id="history-visual" class="history-visual"><div class="empty">Loading visual history...</div></div><div id="timeline" class="timeline"><div class="empty">Loading history...</div></div></section>
        <section id="company-context" class="panel block-company-context"><h2>Company Context</h2><div class="company-context-empty subtle">Loading company context...</div></section>
      </section>
    </main>
    <nav class="app-tabbar" aria-label="App navigation"><a href="./"><span>List</span></a><a href="#snapshot" class="active"><span>Signal</span></a><a href="#behavior"><span>History</span></a><a href="#company-context"><span>Company</span></a></nav>
  </body>
</html>
