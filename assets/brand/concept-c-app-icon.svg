<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Concept C Trading App Icon</title>
  <desc>Dark navy rounded-square trading app icon with white angular market stroke and green rising arrow.</desc>

  <defs>
    <linearGradient id="bg" x1="160" y1="90" x2="880" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#061A35"/>
      <stop offset="0.55" stop-color="#041428"/>
      <stop offset="1" stop-color="#020A14"/>
    </linearGradient>

    <radialGradient id="greenGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(770 805) rotate(-42) scale(330 260)">
      <stop offset="0" stop-color="#10E078" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#0AC66C" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#061A35" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="arrowGreen" x1="495" y1="740" x2="785" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#049F69"/>
      <stop offset="0.42" stop-color="#10C878"/>
      <stop offset="1" stop-color="#18F285"/>
    </linearGradient>

    <linearGradient id="whiteStroke" x1="250" y1="720" x2="500" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7F7F7"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F1F1"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="112" y="112" width="800" height="800" rx="170" fill="url(#bg)"/>
  <rect x="112" y="112" width="800" height="800" rx="170" fill="url(#greenGlow)"/>

  <g filter="url(#softShadow)">
    <!-- left white angular stroke -->
    <path d="M242 690 L434 450 C440 443 451 443 457 450 L548 551 C554 558 554 568 548 575 L514 613 C507 620 497 620 491 613 L448 564 C442 557 431 557 425 565 L315 690 Z"
          fill="url(#whiteStroke)"/>

    <!-- right green rising arrow -->
    <path d="M494 690 L679 417 L637 393 C626 387 628 371 640 367 L797 316 C810 312 822 324 819 337 L785 492 C782 505 766 509 758 499 L724 457 L564 690 Z"
          fill="url(#arrowGreen)"/>
  </g>
</svg>
