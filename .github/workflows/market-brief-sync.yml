name: Market brief sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify Drive access, or sync the newest approved summary
        type: choice
        default: verify
        options: [verify, sync]
  schedule:
    - cron: '45 10 * * *'
      timezone: Australia/Melbourne
    - cron: '45 12 * * *'
      timezone: Australia/Melbourne

permissions:
  contents: read

concurrency:
  group: market-brief-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'yubobo815/daily-watchlist-cloud' && github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || vars.MARKET_BRIEF_SYNC_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      statuses: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check non-secret identity settings
        env:
          GOOGLE_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          GOOGLE_DRIVE_SERVICE_ACCOUNT: ${{ vars.GOOGLE_DRIVE_SERVICE_ACCOUNT }}
          MARKET_REPORTS_DRIVE_FOLDER_ID: ${{ vars.MARKET_REPORTS_DRIVE_FOLDER_ID }}
        run: |
          test -n "$GOOGLE_WORKLOAD_IDENTITY_PROVIDER"
          test -n "$GOOGLE_DRIVE_SERVICE_ACCOUNT"
          test -n "$MARKET_REPORTS_DRIVE_FOLDER_ID"
      - id: google
        name: Obtain a short-lived read-only Google token
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_DRIVE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify folder and published source reads without exposing content
        if: inputs.mode == 'verify'
        env:
          GOOGLE_DRIVE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          MARKET_REPORTS_DRIVE_FOLDER_ID: ${{ vars.MARKET_REPORTS_DRIVE_FOLDER_ID }}
        run: python3 scripts/probe_market_brief_drive.py
      - name: Read and verify the newest approved source summary
        if: inputs.mode != 'verify'
        env:
          GOOGLE_DRIVE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          MARKET_REPORTS_DRIVE_FOLDER_ID: ${{ vars.MARKET_REPORTS_DRIVE_FOLDER_ID }}
        run: python3 scripts/sync_market_brief_drive.py --output "$RUNNER_TEMP/market-brief-candidate.json"
      - name: Audit the public candidate schema and rendering contract
        if: inputs.mode != 'verify'
        run: npm run audit:market-brief -- "$RUNNER_TEMP/market-brief-candidate.json"
      - name: Create a data-only PR and run real Quality checks on its exact SHA
        id: candidate
        if: inputs.mode != 'verify'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish_market_brief.cjs prepare "$RUNNER_TEMP/market-brief-candidate.json" "$RUNNER_TEMP/market-brief-publish-state.json"
      - id: fresh_google
        name: Renew the short-lived reader token after CI
        if: steps.candidate.outputs.changed == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_DRIVE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Re-read Drive before merging and refuse a superseded candidate
        if: steps.candidate.outputs.changed == 'true'
        env:
          GOOGLE_DRIVE_ACCESS_TOKEN: ${{ steps.fresh_google.outputs.access_token }}
          MARKET_REPORTS_DRIVE_FOLDER_ID: ${{ vars.MARKET_REPORTS_DRIVE_FOLDER_ID }}
        run: python3 scripts/sync_market_brief_drive.py --output "$RUNNER_TEMP/market-brief-fresh.json" --expect "$RUNNER_TEMP/market-brief-candidate.json"
      - name: Merge only the protected, exact tested head SHA
        if: steps.candidate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish_market_brief.cjs merge "$RUNNER_TEMP/market-brief-candidate.json" "$RUNNER_TEMP/market-brief-publish-state.json"
      - name: Verify production JSON and rendered source date and forecast
        if: steps.candidate.outputs.changed == 'true'
        run: bash scripts/verify_market_brief_production.sh "$RUNNER_TEMP/market-brief-candidate.json"
