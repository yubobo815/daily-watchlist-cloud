name: Market brief sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify archive access, or publish an owner-curated ready PR
        type: choice
        default: verify
        options: [verify, sync]
      upstream_run_id:
        description: Successful main watchlist run ID (sync only)
        type: string
      expected_publication_id:
        description: Activated watchlist publication ID (sync only)
        type: string

permissions:
  contents: read

concurrency:
  group: market-brief-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'yubobo815/daily-watchlist-cloud' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
      id-token: write
    env:
      MARKET_REPORTS_DRIVE_FOLDER_ID: ${{ vars.MARKET_REPORTS_DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check non-secret identity settings
        env:
          GOOGLE_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          GOOGLE_DRIVE_SERVICE_ACCOUNT: ${{ vars.GOOGLE_DRIVE_SERVICE_ACCOUNT }}
        run: |
          test -n "$GOOGLE_WORKLOAD_IDENTITY_PROVIDER"
          test -n "$GOOGLE_DRIVE_SERVICE_ACCOUNT"
          test -n "$MARKET_REPORTS_DRIVE_FOLDER_ID"
      - name: Inspect verified publication and owner-curated ready PR
        id: candidate
        if: inputs.mode == 'sync'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ inputs.upstream_run_id }}
          EXPECTED_PUBLICATION_ID: ${{ inputs.expected_publication_id }}
        run: node scripts/publish_prepared_market_brief.cjs inspect "$RUNNER_TEMP/brief-state.json" "$RUNNER_TEMP/brief-candidate.json"
      - id: google
        name: Obtain a short-lived read-only Google token
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_DRIVE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify monthly archive reads without exposing content
        if: inputs.mode == 'verify'
        env:
          GOOGLE_DRIVE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python3 scripts/verify_prepared_brief_source.py --probe
      - name: Verify original monthly US report and embedded outlook
        if: inputs.mode == 'sync'
        env:
          GOOGLE_DRIVE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python3 scripts/verify_prepared_brief_source.py "$RUNNER_TEMP/brief-candidate.json"
      - name: Audit public candidate schema and rendering contract
        if: steps.candidate.outputs.changed == 'true'
        run: npm run audit:market-brief -- "$RUNNER_TEMP/brief-candidate.json"
      - name: Wait for real pull_request Quality checks on the exact head
        if: steps.candidate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish_prepared_market_brief.cjs wait "$RUNNER_TEMP/brief-state.json" "$RUNNER_TEMP/brief-candidate.json"
      - id: fresh_google
        name: Renew short-lived reader token after CI
        if: steps.candidate.outputs.changed == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_DRIVE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Re-read Drive immediately before protected merge
        if: steps.candidate.outputs.changed == 'true'
        env:
          GOOGLE_DRIVE_ACCESS_TOKEN: ${{ steps.fresh_google.outputs.access_token }}
        run: python3 scripts/verify_prepared_brief_source.py "$RUNNER_TEMP/brief-candidate.json"
      - name: Recheck live activation and merge only protected exact tested SHA
        if: steps.candidate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish_prepared_market_brief.cjs merge "$RUNNER_TEMP/brief-state.json" "$RUNNER_TEMP/brief-candidate.json"
      - name: Verify production JSON and rendered source date and forecast
        if: steps.candidate.outputs.changed == 'true'
        run: bash scripts/verify_market_brief_production.sh "$RUNNER_TEMP/brief-candidate.json"
