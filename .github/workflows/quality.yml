name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      PYTHONPYCACHEPREFIX: /tmp/watchlist-pycache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install -r requirements.txt
      - name: Check syntax
        run: |
          git ls-files -z '*.py' | xargs -0 python -m py_compile
          git ls-files -z '*.js' | xargs -0 -n 1 node --check
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Run regression audits
        run: npm run audit:watchlist

  browser:
    name: Browser UAT
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Run Docker audits and desktop/mobile browser UAT
        run: npm run uat:docker
