name: Daily Watchlist Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      refresh_mode:
        description: Daily incremental refresh or full weekly rebuild
        required: true
        default: daily
        type: choice
        options:
          - daily
          - weekly_rebuild
      allow_calibration_bootstrap:
        description: Explicitly replace missing/incompatible incremental state
        required: true
        default: false
        type: boolean
      use_stored_ohlcv:
        description: Replay canonical Supabase OHLCV without provider refetches
        required: true
        default: false
        type: boolean
  schedule:
    # Monday-Thursday US sessions use the incremental path. Friday's session
    # performs the bounded 100-session rebuild and calibration parity gate.
    # Avoid the top-of-hour Actions scheduling peak; GitHub may otherwise
    # delay scheduled runs substantially under load.
    - cron: "17 23 * * 1-4"
    - cron: "17 23 * * 5"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: daily-watchlist-pages
  # A cancelled run can stop after writes but before retention cleanup.
  cancel-in-progress: false

jobs:
  build-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      should_run: ${{ steps.time_gate.outputs.run }}
      publication_id: ${{ steps.publication.outputs.publication_id }}
      run_date: ${{ steps.publication.outputs.run_date }}
      rollback_publication_id: ${{ steps.publication.outputs.rollback_publication_id }}

    steps:
      - name: Determine whether to refresh
        id: time_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          REQUESTED_REFRESH_MODE: ${{ inputs.refresh_mode }}
          ALLOW_CALIBRATION_BOOTSTRAP: ${{ inputs.allow_calibration_bootstrap }}
          USE_STORED_OHLCV: ${{ inputs.use_stored_ohlcv }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            if [[ "$COMMIT_MESSAGE" == *"[refresh-watchlist]"* ]]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
            echo "refresh_mode=daily" >> "$GITHUB_OUTPUT"
            echo "bootstrap_arg=" >> "$GITHUB_OUTPUT"
            echo "stored_ohlcv_arg=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "refresh_mode=$REQUESTED_REFRESH_MODE" >> "$GITHUB_OUTPUT"
            if [ "$ALLOW_CALIBRATION_BOOTSTRAP" = "true" ]; then
              echo "bootstrap_arg=--allow-calibration-bootstrap" >> "$GITHUB_OUTPUT"
            else
              echo "bootstrap_arg=" >> "$GITHUB_OUTPUT"
            fi
            if [ "$USE_STORED_OHLCV" = "true" ]; then
              echo "stored_ohlcv_arg=--stored-ohlcv-only" >> "$GITHUB_OUTPUT"
            else
              echo "stored_ohlcv_arg=" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # Scheduled jobs can start well after their nominal cron minute.
          # Never gate them on the runner's wall-clock hour.
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "bootstrap_arg=" >> "$GITHUB_OUTPUT"
          echo "stored_ohlcv_arg=" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_SCHEDULE" = "17 23 * * 5" ]; then
            echo "refresh_mode=weekly_rebuild" >> "$GITHUB_OUTPUT"
          else
            echo "refresh_mode=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.time_gate.outputs.run == 'true'
        uses: actions/checkout@v6

      - name: Set up Python
        if: steps.time_gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.time_gate.outputs.run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Audit watchlist app
        if: steps.time_gate.outputs.run == 'true'
        run: npm run audit:watchlist

      - name: Apply Supabase schema
        if: steps.time_gate.outputs.run == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL is not set; refusing to refresh because schema migrations cannot be applied."
            exit 1
          fi
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -1 -f supabase_schema.sql

      - name: Reserve Supabase publishing headroom
        if: steps.time_gate.outputs.run == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: scripts/database_capacity_guard.sh prepare

      - name: Refresh watchlist
        if: steps.time_gate.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          # Massive/Polygon is the configured paid primary feed. Keeping Yahoo
          # as fallback avoids a slow, serial public-feed scan on every run.
          DATA_PROVIDER_PRIORITY: polygon,twelvedata,stooq,yahoo
          MARKET_DATA_TIMEOUT_SECONDS: "12"
        # Two years of source OHLCV leaves enough post-warmup bars for the
        # 100-session learning baseline. Supabase still retains only 30 display
        # days plus a capped compact outcome table.
        run: python daily_watchlist_overview.py --refresh --skip-profiles --years 2 --history-days 30 --learning-lookback-days 60 --learning-baseline-days 100 --refresh-mode "${{ steps.time_gate.outputs.refresh_mode }}" ${{ steps.time_gate.outputs.bootstrap_arg }} ${{ steps.time_gate.outputs.stored_ohlcv_arg }}

      - name: Audit Supabase learning health
        if: steps.time_gate.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          EXPECTED_RUN_DATE="$(python -c 'import json; print(json.load(open("daily_watchlist_run_metadata_latest.json"))["run_date"])')"
          EXPECTED_PUBLICATION_ID="$(python -c 'import json; print(json.load(open("daily_watchlist_run_metadata_latest.json"))["publication_id"])')"
          export EXPECTED_RUN_DATE EXPECTED_PUBLICATION_ID
          python scripts/supabase_learning_health.py

      - name: Enforce staged database ceiling
        if: steps.time_gate.outputs.run == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: scripts/database_capacity_guard.sh staged

      - name: Prepare Pages artifact
        if: steps.time_gate.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p public
          mkdir -p public/data
          # Keep the scanner-generated history page; it is publication-bound.
          git checkout -- index.html assets manifest.webmanifest
          cp index.html public/index.html
          cp history.html public/history.html
          cp ticker.html public/ticker.html
          cp manifest.webmanifest public/manifest.webmanifest
          cp -R assets public/assets
          cp daily_watchlist_overview_latest.csv public/daily_watchlist_overview_latest.csv
          cp daily_watchlist_run_metadata_latest.json public/data/run_metadata.json
          cp daily_watchlist_overview_failures.csv public/daily_watchlist_overview_failures.csv 2>/dev/null || true
          cp daily_watchlist_overview_stale_cache.csv public/daily_watchlist_overview_stale_cache.csv 2>/dev/null || true
          python scripts/build_pages_data.py \
            --latest daily_watchlist_overview_latest.csv \
            --history watchlist_behavior_history_latest.csv \
            --metadata daily_watchlist_run_metadata_latest.json \
            --output public/data

      - name: Audit Pages data architecture
        if: steps.time_gate.outputs.run == 'true'
        run: node scripts/audit_frontend_architecture.js

      - name: Preserve current Pages publication for rollback
        if: steps.time_gate.outputs.run == 'true'
        env:
          PAGE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          python scripts/build_pages_rollback.py \
            --base-url "$PAGE_BASE_URL" \
            --output public-rollback

      - name: Record publication identifiers
        id: publication
        if: steps.time_gate.outputs.run == 'true'
        shell: bash
        run: |
          {
            echo "publication_id=$(python -c 'import json; print(json.load(open("daily_watchlist_run_metadata_latest.json"))["publication_id"])')"
            echo "run_date=$(python -c 'import json; print(json.load(open("daily_watchlist_run_metadata_latest.json"))["run_date"])')"
            echo "rollback_publication_id=$(cat public-rollback/rollback_publication_id.txt)"
          } >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        id: configure_pages
        if: steps.time_gate.outputs.run == 'true'
        continue-on-error: true
        uses: actions/configure-pages@v6

      - name: Retry Pages configuration
        if: steps.time_gate.outputs.run == 'true' && steps.configure_pages.outcome == 'failure'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.time_gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: public

      - name: Upload Pages rollback artifact
        if: steps.time_gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-rollback
          path: public-rollback

      - name: Mark Supabase publication validated
        if: steps.time_gate.outputs.run == 'true'
        id: finalize_publication
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          EXPECTED_RUN_DATE="$(python -c 'import json; print(json.load(open("daily_watchlist_run_metadata_latest.json"))["run_date"])')"
          EXPECTED_PUBLICATION_ID="$(python -c 'import json; print(json.load(open("daily_watchlist_run_metadata_latest.json"))["publication_id"])')"
          export EXPECTED_RUN_DATE EXPECTED_PUBLICATION_ID
          python scripts/supabase_learning_health.py --finalize

      - name: Roll back staged publication after build failure
        if: always() && steps.time_gate.outputs.run == 'true' && failure()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: scripts/database_capacity_guard.sh rollback

  # Pages marks an environment deployment complete only when this job exits.
  # Keeping deployment isolated lets the following job observe the new CDN state.
  deploy-pages:
    needs: build-publication
    if: needs.build-publication.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy immutable Pages artifact
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Retry GitHub Pages deployment
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        continue-on-error: true
        uses: actions/deploy-pages@v5

  verify-and-activate:
    needs:
      - build-publication
      - deploy-pages
    if: always() && needs.build-publication.result == 'success' && needs.build-publication.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify deployed Pages publication
        env:
          PAGE_URL: ${{ needs.deploy-pages.outputs.page_url }}
          EXPECTED_PUBLICATION_ID: ${{ needs.build-publication.outputs.publication_id }}
        shell: bash
        run: |
          PAGE_URL="${PAGE_URL:-https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/}"
          for _ in $(seq 1 36); do
            if python scripts/verify_pages_publication.py \
              --base-url "$PAGE_URL" \
              --expected-publication "$EXPECTED_PUBLICATION_ID"; then
              exit 0
            fi
            sleep 10
          done
          echo "Pages publication verification failed after 36 attempts."
          exit 1

      - name: Activate Supabase publication
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXPECTED_RUN_DATE: ${{ needs.build-publication.outputs.run_date }}
          EXPECTED_PUBLICATION_ID: ${{ needs.build-publication.outputs.publication_id }}
        run: python scripts/supabase_learning_health.py --activate

  finalize-storage:
    needs:
      - build-publication
      - verify-and-activate
    if: needs.build-publication.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reclaim Supabase replay storage
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          printf '{"publication_id":"%s","run_date":"%s"}\n' \
            "${{ needs.build-publication.outputs.publication_id }}" \
            "${{ needs.build-publication.outputs.run_date }}" \
            > daily_watchlist_run_metadata_latest.json
          for attempt in 1 2 3; do
            if scripts/database_capacity_guard.sh finalize; then
              exit 0
            fi
            echo "Final retention attempt $attempt failed; retrying."
            sleep $((attempt * 10))
          done
          exit 1

  restore-pages-after-failed-activation:
    needs:
      - build-publication
      - deploy-pages
      - verify-and-activate
    if: always() && needs.build-publication.result == 'success' && needs.build-publication.outputs.should_run == 'true' && needs.verify-and-activate.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.rollback_deployment_retry.outputs.page_url || steps.rollback_deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.rollback_deployment_retry.outputs.page_url || steps.rollback_deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Confirm failed publication is inactive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXPECTED_PUBLICATION_ID: ${{ needs.build-publication.outputs.publication_id }}
        run: python scripts/supabase_learning_health.py --assert-inactive

      - name: Restore previous Pages publication
        id: rollback_deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-rollback

      - name: Retry previous Pages publication restore
        if: steps.rollback_deployment.outcome == 'failure'
        id: rollback_deployment_retry
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-rollback

  verify-pages-rollback:
    needs:
      - build-publication
      - restore-pages-after-failed-activation
    if: always() && needs.restore-pages-after-failed-activation.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify restored Pages publication
        env:
          PAGE_URL: ${{ needs.restore-pages-after-failed-activation.outputs.page_url }}
          ROLLBACK_PUBLICATION_ID: ${{ needs.build-publication.outputs.rollback_publication_id }}
        run: |
          PAGE_URL="${PAGE_URL:-https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/}"
          for _ in $(seq 1 36); do
            if python scripts/verify_pages_publication.py \
              --base-url "$PAGE_URL" \
              --expected-publication "$ROLLBACK_PUBLICATION_ID"; then
              exit 0
            fi
            sleep 10
          done
          echo "Restored Pages publication could not be verified."
          exit 1

      - name: Roll back inactive Supabase publication
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          printf '{"publication_id":"%s"}\n' \
            "${{ needs.build-publication.outputs.publication_id }}" \
            > daily_watchlist_run_metadata_latest.json
          scripts/database_capacity_guard.sh rollback
