name: Daily Watchlist Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      refresh_mode:
        description: Daily incremental refresh or full weekly rebuild
        required: true
        default: daily
        type: choice
        options:
          - daily
          - weekly_rebuild
      allow_calibration_bootstrap:
        description: Explicitly replace missing/incompatible incremental state
        required: true
        default: false
        type: boolean
  schedule:
    # Monday-Thursday US sessions use the incremental path. Friday's session
    # performs the bounded 60-session rebuild and calibration parity gate.
    - cron: "0 23 * * 1-4"
    - cron: "0 23 * * 5"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: daily-watchlist-pages
  # A cancelled run can stop after writes but before retention cleanup.
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Determine whether to refresh
        id: time_gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            if [[ "${{ github.event.head_commit.message }}" == *"[refresh-watchlist]"* ]]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
            echo "refresh_mode=daily" >> "$GITHUB_OUTPUT"
            echo "bootstrap_arg=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "refresh_mode=${{ inputs.refresh_mode }}" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.allow_calibration_bootstrap }}" = "true" ]; then
              echo "bootstrap_arg=--allow-calibration-bootstrap" >> "$GITHUB_OUTPUT"
            else
              echo "bootstrap_arg=" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # Scheduled jobs can start well after their nominal cron minute.
          # Never gate them on the runner's wall-clock hour.
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "bootstrap_arg=" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.schedule }}" = "0 23 * * 5" ]; then
            echo "refresh_mode=weekly_rebuild" >> "$GITHUB_OUTPUT"
          else
            echo "refresh_mode=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.time_gate.outputs.run == 'true'
        uses: actions/checkout@v6

      - name: Set up Python
        if: steps.time_gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.time_gate.outputs.run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Audit watchlist app
        if: steps.time_gate.outputs.run == 'true'
        run: npm run audit:watchlist

      - name: Apply Supabase schema
        if: steps.time_gate.outputs.run == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL is not set; refusing to refresh because schema migrations cannot be applied."
            exit 1
          fi
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase_schema.sql

      - name: Reserve Supabase publishing headroom
        if: steps.time_gate.outputs.run == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: scripts/database_capacity_guard.sh prepare

      - name: Refresh watchlist
        if: steps.time_gate.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          # Massive/Polygon is the configured paid primary feed. Keeping Yahoo
          # as fallback avoids a slow, serial public-feed scan on every run.
          DATA_PROVIDER_PRIORITY: polygon,twelvedata,stooq,yahoo
          MARKET_DATA_TIMEOUT_SECONDS: "12"
        # Two years of source OHLCV leaves enough post-warmup bars for the
        # 60-session learning replay. Supabase still retains only 30 display
        # days plus a capped compact outcome table.
        run: python daily_watchlist_overview.py --refresh --skip-profiles --years 2 --history-days 30 --learning-lookback-days 60 --refresh-mode "${{ steps.time_gate.outputs.refresh_mode }}" ${{ steps.time_gate.outputs.bootstrap_arg }}

      - name: Audit Supabase learning health
        if: steps.time_gate.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          export EXPECTED_RUN_DATE="$(python -c 'import json; print(json.load(open("daily_watchlist_run_metadata_latest.json"))["run_date"])')"
          export EXPECTED_PUBLICATION_ID="$(python -c 'import json; print(json.load(open("daily_watchlist_run_metadata_latest.json"))["publication_id"])')"
          python scripts/supabase_learning_health.py

      - name: Enforce staged database ceiling
        if: steps.time_gate.outputs.run == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: scripts/database_capacity_guard.sh staged

      - name: Prepare Pages artifact
        if: steps.time_gate.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p public
          mkdir -p public/data
          # Keep the scanner-generated history page; it is publication-bound.
          git checkout -- index.html assets manifest.webmanifest
          cp index.html public/index.html
          cp history.html public/history.html
          cp ticker.html public/ticker.html
          cp manifest.webmanifest public/manifest.webmanifest
          cp -R assets public/assets
          cp daily_watchlist_overview_latest.csv public/daily_watchlist_overview_latest.csv
          cp daily_watchlist_run_metadata_latest.json public/data/run_metadata.json
          cp daily_watchlist_overview_failures.csv public/daily_watchlist_overview_failures.csv 2>/dev/null || true
          cp daily_watchlist_overview_stale_cache.csv public/daily_watchlist_overview_stale_cache.csv 2>/dev/null || true
          python scripts/build_pages_data.py \
            --latest daily_watchlist_overview_latest.csv \
            --history watchlist_behavior_history_latest.csv \
            --metadata daily_watchlist_run_metadata_latest.json \
            --output public/data

      - name: Audit Pages data architecture
        if: steps.time_gate.outputs.run == 'true'
        run: node scripts/audit_frontend_architecture.js

      - name: Configure Pages
        id: configure_pages
        if: steps.time_gate.outputs.run == 'true'
        continue-on-error: true
        uses: actions/configure-pages@v6

      - name: Retry Pages configuration
        if: steps.time_gate.outputs.run == 'true' && steps.configure_pages.outcome == 'failure'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.time_gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Finalize Supabase publication
        if: steps.time_gate.outputs.run == 'true'
        id: finalize_publication
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          export EXPECTED_RUN_DATE="$(python -c 'import json; print(json.load(open("daily_watchlist_run_metadata_latest.json"))["run_date"])')"
          export EXPECTED_PUBLICATION_ID="$(python -c 'import json; print(json.load(open("daily_watchlist_run_metadata_latest.json"))["publication_id"])')"
          python scripts/supabase_learning_health.py --finalize

      # Publish static files only after the database CAS promotion succeeds.
      # A Pages failure can then leave the previous static page in place, but
      # can never expose a staged publication that the database rolls back.
      - name: Deploy to GitHub Pages
        if: steps.time_gate.outputs.run == 'true'
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Retry GitHub Pages deployment
        if: steps.time_gate.outputs.run == 'true' && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Reclaim Supabase replay storage
        if: always() && steps.time_gate.outputs.run == 'true' && steps.finalize_publication.outcome == 'success'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: scripts/database_capacity_guard.sh finalize

      - name: Roll back incomplete Supabase publication
        if: always() && steps.time_gate.outputs.run == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: scripts/database_capacity_guard.sh rollback
