name: Daily Watchlist Pages

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules use UTC. Running at both 21:00 and 22:00 UTC lets
    # the timezone gate below handle Australia/Melbourne daylight saving.
    - cron: "0 21,22 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-watchlist-pages
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check local run time
        id: time_gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          local_hour="$(TZ=Australia/Melbourne date +%H)"
          if [ "$local_hour" = "08" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.time_gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.time_gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.time_gate.outputs.run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Refresh watchlist
        if: steps.time_gate.outputs.run == 'true'
        run: python daily_watchlist_overview.py --refresh

      - name: Prepare Pages artifact
        if: steps.time_gate.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p public
          cp daily_watchlist_overview_latest.html public/index.html
          cp daily_watchlist_overview_latest.html public/daily_watchlist_overview_latest.html
          cp daily_watchlist_overview_latest.csv public/daily_watchlist_overview_latest.csv
          cp daily_watchlist_overview_failures.csv public/daily_watchlist_overview_failures.csv 2>/dev/null || true
          cp daily_watchlist_overview_stale_cache.csv public/daily_watchlist_overview_stale_cache.csv 2>/dev/null || true

      - name: Configure Pages
        if: steps.time_gate.outputs.run == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.time_gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        if: steps.time_gate.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
