name: Daily Watchlist Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # GitHub schedules use UTC. Running at both 21:00 and 22:00 UTC lets
    # the timezone gate below handle Australia/Melbourne daylight saving.
    # The gate accepts 08:xx and 09:xx local time so GitHub queue delays do
    # not accidentally skip the daily refresh.
    - cron: "0 21,22 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-watchlist-pages
  cancel-in-progress: true

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check local run time
        id: time_gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          local_hour="$(TZ=Australia/Melbourne date +%H)"
          if [ "$local_hour" = "08" ] || [ "$local_hour" = "09" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.time_gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.time_gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.time_gate.outputs.run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Refresh watchlist
        if: steps.time_gate.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python daily_watchlist_overview.py --refresh

      - name: Prepare Pages artifact
        if: steps.time_gate.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p public
          mkdir -p public/data
          git checkout -- index.html history.html assets manifest.webmanifest
          cp index.html public/index.html
          cp history.html public/history.html
          cp manifest.webmanifest public/manifest.webmanifest
          cp -R assets public/assets
          cp daily_watchlist_overview_latest.csv public/daily_watchlist_overview_latest.csv
          cp watchlist_behavior_history_latest.csv public/watchlist_behavior_history_latest.csv
          cp daily_watchlist_overview_failures.csv public/daily_watchlist_overview_failures.csv 2>/dev/null || true
          cp daily_watchlist_overview_stale_cache.csv public/daily_watchlist_overview_stale_cache.csv 2>/dev/null || true
          python - <<'PY'
          import csv, json, pathlib

          def read_csv(path):
              source = pathlib.Path(path)
              if not source.exists():
                  return []
              with source.open(newline="") as handle:
                  return list(csv.DictReader(handle))

          latest_rows = read_csv("daily_watchlist_overview_latest.csv")
          history_rows = read_csv("watchlist_behavior_history_latest.csv")
          run_date = ""
          for row in latest_rows:
              run_date = row.get("run_date") or row.get("date") or run_date
              row["payload"] = {key: value for key, value in row.items() if key != "payload"}
          by_ticker = {}
          for row in history_rows:
              ticker = row.get("ticker")
              row["payload"] = {key: value for key, value in row.items() if key != "payload"}
              if ticker:
                  by_ticker.setdefault(ticker, []).append(row)
          pathlib.Path("public/data/latest.json").write_text(json.dumps({"run_date": run_date, "rows": latest_rows}, separators=(",", ":")))
          pathlib.Path("public/data/history.json").write_text(json.dumps({"run_date": run_date, "rows": history_rows, "by_ticker": by_ticker}, separators=(",", ":")))
          PY

      - name: Configure Pages
        if: steps.time_gate.outputs.run == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.time_gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        if: steps.time_gate.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
