name: Daily Watchlist Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # GitHub schedules use UTC. Running at both 22:00 and 23:00 UTC lets
    # the timezone gate below handle Australia/Melbourne daylight saving.
    # 09:xx Melbourne leaves a buffer after the US regular-session close.
    - cron: "0 22,23 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: daily-watchlist-pages
  # A cancelled run can stop after writes but before retention cleanup.
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check local run time
        id: time_gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            if [[ "${{ github.event.head_commit.message }}" == *"[refresh-watchlist]"* ]]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          local_hour="$(TZ=Australia/Melbourne date +%H)"
          if [ "$local_hour" = "09" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.time_gate.outputs.run == 'true'
        uses: actions/checkout@v6

      - name: Set up Python
        if: steps.time_gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.time_gate.outputs.run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Audit watchlist app
        if: steps.time_gate.outputs.run == 'true'
        run: npm run audit:watchlist

      - name: Apply Supabase schema
        if: steps.time_gate.outputs.run == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL is not set; refusing to refresh because schema migrations cannot be applied."
            exit 1
          fi
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase_schema.sql

      - name: Reserve Supabase publishing headroom
        if: steps.time_gate.outputs.run == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: scripts/database_capacity_guard.sh prepare

      - name: Refresh watchlist
        if: steps.time_gate.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          # Massive/Polygon is the configured paid primary feed. Keeping Yahoo
          # as fallback avoids a slow, serial public-feed scan on every run.
          DATA_PROVIDER_PRIORITY: polygon,twelvedata,stooq,yahoo
          MARKET_DATA_TIMEOUT_SECONDS: "12"
        # Two years of source OHLCV leaves enough post-warmup bars for the
        # 60-session learning replay. Supabase still retains only 30 display
        # days plus a capped compact outcome table.
        run: python daily_watchlist_overview.py --refresh --skip-profiles --years 2 --history-days 30 --learning-lookback-days 60

      - name: Audit Supabase learning health
        if: steps.time_gate.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          export EXPECTED_RUN_DATE="$(python -c 'import json; print(json.load(open("daily_watchlist_run_metadata_latest.json"))["run_date"])')"
          export EXPECTED_PUBLICATION_ID="$(python -c 'import json; print(json.load(open("daily_watchlist_run_metadata_latest.json"))["publication_id"])')"
          python scripts/supabase_learning_health.py

      - name: Enforce staged database ceiling
        if: steps.time_gate.outputs.run == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: scripts/database_capacity_guard.sh staged

      - name: Prepare Pages artifact
        if: steps.time_gate.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p public
          mkdir -p public/data
          git checkout -- index.html history.html assets manifest.webmanifest
          cp index.html public/index.html
          cp history.html public/history.html
          cp ticker.html public/ticker.html
          cp manifest.webmanifest public/manifest.webmanifest
          cp -R assets public/assets
          cp daily_watchlist_overview_latest.csv public/daily_watchlist_overview_latest.csv
          cp watchlist_behavior_history_latest.csv public/watchlist_behavior_history_latest.csv
          cp daily_watchlist_run_metadata_latest.json public/data/run_metadata.json
          cp daily_watchlist_overview_failures.csv public/daily_watchlist_overview_failures.csv 2>/dev/null || true
          cp daily_watchlist_overview_stale_cache.csv public/daily_watchlist_overview_stale_cache.csv 2>/dev/null || true
          python - <<'PY'
          import csv, json, pathlib

          def read_csv(path):
              source = pathlib.Path(path)
              if not source.exists():
                  return []
              with source.open(newline="") as handle:
                  return list(csv.DictReader(handle))

          latest_rows = read_csv("daily_watchlist_overview_latest.csv")
          history_rows = read_csv("watchlist_behavior_history_latest.csv")
          run_metadata = {}
          metadata_path = pathlib.Path("daily_watchlist_run_metadata_latest.json")
          if metadata_path.exists():
              run_metadata = json.loads(metadata_path.read_text())
          run_date = str(run_metadata.get("run_date") or "")
          for row in latest_rows:
              run_date = row.get("run_date") or run_date or row.get("date") or ""
              row["payload"] = {key: value for key, value in row.items() if key != "payload"}
          by_ticker = {}
          for row in history_rows:
              ticker = row.get("ticker")
              row["payload"] = {key: value for key, value in row.items() if key != "payload"}
              if ticker:
                  by_ticker.setdefault(ticker, []).append(row)
          latest_payload = {"run_date": run_date, "rows": latest_rows}
          history_payload = {"run_date": run_date, "rows": history_rows, "by_ticker": by_ticker}
          if run_metadata:
              latest_payload["runInfo"] = run_metadata
              history_payload["runInfo"] = run_metadata
          pathlib.Path("public/data/latest.json").write_text(json.dumps(latest_payload, separators=(",", ":")))
          pathlib.Path("public/data/history.json").write_text(json.dumps(history_payload, separators=(",", ":")))
          PY

      - name: Configure Pages
        if: steps.time_gate.outputs.run == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.time_gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        if: steps.time_gate.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Finalize Supabase publication
        if: steps.time_gate.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          export EXPECTED_RUN_DATE="$(python -c 'import json; print(json.load(open("daily_watchlist_run_metadata_latest.json"))["run_date"])')"
          export EXPECTED_PUBLICATION_ID="$(python -c 'import json; print(json.load(open("daily_watchlist_run_metadata_latest.json"))["publication_id"])')"
          python scripts/supabase_learning_health.py --finalize

      - name: Reclaim Supabase replay storage
        if: steps.time_gate.outputs.run == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: scripts/database_capacity_guard.sh finalize

      - name: Roll back incomplete Supabase publication
        if: always() && steps.time_gate.outputs.run == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: scripts/database_capacity_guard.sh rollback
