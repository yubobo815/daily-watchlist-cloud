<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily Trade Copilot</title>
    <meta name="description" content="Daily trading copilot powered by Supabase watchlist data.">
    <link rel="icon" href="./assets/brand/concept-c-app-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./assets/brand/apple-touch-icon.png">
    <link rel="stylesheet" href="./assets/styles.css?v=arc-gauge-3-20260601">
    <script defer src="./assets/app.js?v=arc-gauge-3-20260601"></script>
  </head>
  <body data-page="watchlist">
    <main class="shell">
      <section class="hero">
        <div>
          <a class="brand" href="./" aria-label="Daily Trade Copilot home">
            <span class="brand-mark" aria-hidden="true">
              <img src="./assets/brand/concept-c-app-icon.svg" alt="">
            </span>
            <span class="brand-copy">
              <span class="brand-name">Daily Trade Copilot</span>
              <span class="brand-subtitle">Trading cockpit</span>
            </span>
          </a>
          <h1>Daily Trade Copilot</h1>
          <p id="status" class="subtle meta">Loading Supabase watchlist...</p>
          <div id="run-status" class="status bad">Waiting for database config</div>
        </div>
      </section>

      <section id="cards" class="cards"></section>

      <section class="controls">
        <input id="search" class="search" placeholder="Search ticker, candle behavior, note, mode...">
        <button id="all-filter" class="chip active" type="button">All</button>
        <select id="sort" class="control">
          <option value="score-desc">Conviction high to low</option>
          <option value="day_change_pct-desc">Best day change</option>
          <option value="day_change_pct-asc">Worst day change</option>
          <option value="ticker-asc">Ticker A to Z</option>
        </select>
        <div id="count" class="count">0 / 0 shown</div>
      </section>

      <section id="today-focus" class="today-focus"></section>

      <section id="changed-today" class="changed-today"></section>

      <section class="table-wrap">
        <table>
          <thead id="watchlist-head"></thead>
          <tbody id="watchlist-body"></tbody>
        </table>
        <div id="empty" class="empty hidden">No matching rows yet.</div>
      </section>
    </main>
  </body>
</html>
