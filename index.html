<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily Trade Copilot</title>
    <meta name="description" content="Daily trading copilot powered by Supabase watchlist data.">
    <link rel="stylesheet" href="./assets/styles.css">
    <script defer src="./assets/app.js"></script>
  </head>
  <body data-page="watchlist">
    <main class="shell">
      <section class="hero">
        <div>
          <a class="brand" href="./" aria-label="Daily Trade Copilot home">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 64 64" role="img">
                <defs>
                  <linearGradient id="mark-bg-home" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
                    <stop offset="0" stop-color="#1d271f"></stop>
                    <stop offset="1" stop-color="#080b09"></stop>
                  </linearGradient>
                </defs>
                <rect class="mark-bg" x="3" y="3" width="58" height="58" rx="18" fill="url(#mark-bg-home)"></rect>
                <path class="mark-grid" d="M17 18h30M17 32h30M17 46h30M18 17v30M32 17v30M46 17v30"></path>
                <path class="mark-monogram" d="M17 45V19h9c8 0 13 5 13 13s-5 13-13 13h-9M28 19h20M38 19v26"></path>
                <path class="mark-signal" d="M14 42l9-11 8 6 10-17 9 4"></path>
                <circle class="mark-dot" cx="50" cy="24" r="4"></circle>
              </svg>
            </span>
            <span class="brand-copy">
              <span class="brand-name">Daily Trade Copilot</span>
              <span class="brand-subtitle">Trading cockpit</span>
            </span>
          </a>
          <h1>Daily Trade Copilot</h1>
          <p id="status" class="subtle meta">Loading Supabase watchlist...</p>
          <p class="subtle trust-note">Public read-only view. Visitors can filter and search visible data, but they cannot change the project or write scanner data.</p>
          <div id="run-status" class="status bad">Waiting for database config</div>
        </div>
      </section>

      <section id="cards" class="cards"></section>

      <section class="controls">
        <input id="search" class="search" placeholder="Search ticker, setup, note, mode...">
        <button id="all-filter" class="chip active" type="button">All</button>
        <select id="sort" class="control">
          <option value="score-desc">Score high to low</option>
          <option value="day_change_pct-desc">Best day change</option>
          <option value="day_change_pct-asc">Worst day change</option>
          <option value="ticker-asc">Ticker A to Z</option>
        </select>
        <div id="count" class="count">0 / 0 shown</div>
      </section>

      <section class="table-wrap">
        <table>
          <thead id="watchlist-head"></thead>
          <tbody id="watchlist-body"></tbody>
        </table>
        <div id="empty" class="empty hidden">No matching rows yet.</div>
      </section>
    </main>
  </body>
</html>
