<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily Trade Copilot</title>
    <meta name="description" content="Daily trading copilot powered by Supabase watchlist data.">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#eef0eb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0e1411" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Trade Copilot">
    <link rel="icon" href="./assets/brand/concept-c-app-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./assets/brand/apple-touch-icon.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./assets/styles.css?v=v3-3-top-tools">
    <script defer src="./assets/market-session.js?v=v3-3-top-tools"></script>
    <script defer src="./assets/presentation.js?v=v3-3-top-tools"></script>
    <script defer src="./assets/app.js?v=v3-3-top-tools"></script>
  </head>
  <body data-page="watchlist">
    <main class="shell">
      <header class="top-utility-row">
        <section id="market-rail" class="market-rail" aria-label="Data freshness"></section>
        <section class="secondary-tools" aria-label="Watchlist tools">
          <section id="profit-alerts" class="profit-alert-center" aria-live="polite"></section>
          <details id="market-activity" class="secondary-insights">
            <summary>Market activity <span>changes, movers, saved names</span></summary>
            <div class="utility-drawer-body">
              <section id="today-focus" class="today-focus"></section>
              <section id="signal-changes" class="changed-today"></section>
              <section id="price-movers" class="price-movers"></section>
              <section id="focus-list" class="focus-list"></section>
            </div>
          </details>
        </section>
      </header>
      <section class="hero editorial-hero">
        <div>
          <a class="brand" href="./" aria-label="Daily Trade Copilot home">
            <span class="brand-mark" aria-hidden="true">
              <img src="./assets/brand/concept-c-app-icon.svg" alt="">
            </span>
            <span class="brand-copy">
              <span class="brand-name">Daily Trade Copilot</span>
              <span class="brand-subtitle">Watchlist</span>
            </span>
          </a>
          <h1 class="sr-only">Daily Trade Copilot</h1>
          <p id="status" class="subtle meta">Loading Supabase watchlist...</p>
          <div id="run-status" class="status bad">Waiting for database config</div>
          <p id="app-disclaimer" class="app-disclaimer"></p>
        </div>
        <div id="hero-brief" class="hero-brief" aria-live="polite"></div>
      </section>

      <section class="mobile-search-panel" aria-label="Mobile watchlist search">
        <div class="mobile-search-top">
          <span>Find ticker</span>
          <strong id="mobile-search-count">Loading...</strong>
        </div>
        <div class="search-shell mobile-search-shell">
          <input id="mobile-search" class="search" type="search" placeholder="Search ticker, company, signal..." autocomplete="off" inputmode="search">
          <button id="mobile-clear-search" class="search-clear hidden" type="button" aria-label="Clear mobile search">Clear</button>
        </div>
        <div class="mobile-filter-row" aria-label="Signal filters">
          <button type="button" data-mobile-filter="all">All</button>
          <button type="button" data-mobile-filter="buy">Buy</button>
          <button type="button" data-mobile-filter="building">Building</button>
          <button type="button" data-mobile-filter="watch">Watch</button>
          <button type="button" data-mobile-filter="risk">Risk</button>
        </div>
      </section>

      <section id="daily-brief" class="daily-brief" aria-hidden="true"></section>

      <section id="run-health-panel" class="run-health-panel"></section>

      <section id="cards" class="cards"></section>

      <section class="watchlist-workspace">
      <section id="watchlist-table" class="table-wrap">
        <div class="section-heading watchlist-heading">
          <div>
            <span>Watchlist</span>
          </div>
        </div>
        <section class="controls">
          <div class="search-shell">
            <input id="search" class="search" type="search" placeholder="Search ticker, company, or signal..." autocomplete="off" inputmode="search">
            <button id="clear-search" class="search-clear hidden" type="button" aria-label="Clear search">Clear</button>
          </div>
          <select id="sort" class="control">
            <option value="execution_priority-asc">Scanner rank first</option>
            <option value="score-desc">Trend quality high to low</option>
            <option value="day_change_pct-desc">Best day change</option>
            <option value="day_change_pct-asc">Worst day change</option>
            <option value="ticker-asc">Ticker A to Z</option>
          </select>
          <div id="count" class="count">Loading...</div>
        </section>
        <table>
          <thead id="watchlist-head"></thead>
          <tbody id="watchlist-body"></tbody>
        </table>
        <div id="empty" class="empty hidden">No matching rows yet.</div>
        <div class="watchlist-pagination"><button id="show-more" class="button secondary hidden" type="button">Show more</button></div>
      </section>
      <aside id="ticker-detail-panel" class="ticker-detail-panel" aria-label="Selected ticker scanner review"></aside>
      </section>

    </main>
    <nav class="app-tabbar" aria-label="App navigation">
      <a href="#cards" class="active"><span>Overview</span></a>
      <a href="#market-activity"><span>Activity</span></a>
      <a href="#watchlist-table"><span>Watchlist</span></a>
    </nav>
  </body>
</html>
